services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sesen
      POSTGRES_USER: sesen
      POSTGRES_PASSWORD: sesen
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sesen -d sesen"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sesen
      SPRING_DATASOURCE_USERNAME: sesen
      SPRING_DATASOURCE_PASSWORD: sesen
      SESEN_TELEGRAM_BOT_TOKEN: ${SESEN_TELEGRAM_BOT_TOKEN:-}
      SESEN_DEV_AUTH_ENABLED: "false"
      SESEN_CORS_ORIGINS: "http://localhost:5173"
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  postgres_data:
